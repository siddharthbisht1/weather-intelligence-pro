<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Weather Intelligence Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #0B1120; 
            color: white; 
            margin: 0; 
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        #particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        
        .auth-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 450px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .auth-header { text-align: center; margin-bottom: 30px; }
        .auth-header i { font-size: 40px; color: #38BDF8; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(56,189,248,0.3)); }
        .auth-header h1 { font-size: 24px; font-weight: 700; margin: 0; }
        .auth-header p { color: #94A3B8; font-size: 14px; margin-top: 5px; }
        .error-msg {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #FCA5A5;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { 
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%); 
            color: #64748B; font-size: 14px; 
        }
        
        .auth-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px 15px 12px 45px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .auth-input:focus { border-color: #38BDF8; box-shadow: 0 0 10px rgba(56,189,248,0.2); background: rgba(56, 189, 248, 0.05); }
        .auth-input::placeholder { color: #64748B; }
        .toggle-password {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            left: auto !important;
            color: #64748B; cursor: pointer;
        }
        .toggle-password:hover { color: #38BDF8; }
        .terms-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 13px; color: #94A3B8; }
        .terms-row input[type="checkbox"] { accent-color: #38BDF8; cursor: pointer; }
        .terms-row a { color: #38BDF8; text-decoration: none; font-weight: 500; }
        .terms-row a:hover { text-decoration: underline; }
        .auth-btn {
            width: 100%;
            background: linear-gradient(135deg, #38BDF8, #0284C7);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .auth-btn:hover { box-shadow: 0 10px 20px rgba(56,189,248,0.4); transform: translateY(-2px); }
        .auth-footer { text-align: center; margin-top: 25px; font-size: 13px; color: #94A3B8; }
        .auth-footer a { color: #38BDF8; text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="auth-card">
        
        <div class="auth-header">
            <i class="fas fa-cloud-sun"></i>
            <h1>Weather Intelligence Pro</h1>
            <p>Create your premium account</p>
        </div>

        <div id="errorBox" class="error-msg"></div>

        <form id="registerForm">
            
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" class="auth-input" id="regFullName" placeholder="Full Name" required autocomplete="off">
            </div>

            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" class="auth-input" id="regEmail" placeholder="Email Address" required autocomplete="off">
            </div>

            <div class="input-group">
                <i class="fas fa-user-circle"></i>
                <input type="text" class="auth-input" id="regUsername" placeholder="Username" required autocomplete="off">
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" class="auth-input" id="regPassword" placeholder="Password" required>
                <i class="fas fa-eye toggle-password" onclick="togglePass('regPassword', this)"></i>
            </div>
            <div style="font-size: 11px; color: #64748B; margin: -10px 0 15px 5px;">Password Strength</div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" class="auth-input" id="regConfirmPassword" placeholder="Confirm Password" required>
            </div>

            <div class="terms-row">
                <input type="checkbox" id="termsCheck" required>
                <label for="termsCheck">I agree to the <a href="#">Terms & Conditions</a></label>
            </div>

            <button type="submit" id="submitBtn" class="auth-btn">
                Create Account <i class="fas fa-arrow-right"></i>
            </button>

        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Log In here</a>
        </div>

    </div>

    <script>
        function togglePass(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = "password";
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            if (typeof particlesJS !== "undefined") {
                particlesJS("particles-js", {
                    particles: { number: { value: 50 }, color: { value: "#38BDF8" }, shape: { type: "circle" }, opacity: { value: 0.3 }, size: { value: 3 }, move: { enable: true, speed: 1.5 } }
                });
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 

            const fullName = document.getElementById('regFullName').value;
            const email = document.getElementById('regEmail').value;
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            
            const btn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');
            
            if (password !== confirmPassword) {
                errorBox.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Passwords do not match!';
                errorBox.style.display = 'block';
                return;
            }

            errorBox.style.display = 'none';
            btn.innerHTML = 'Creating Account... <i class="fas fa-spinner fa-spin"></i>';
            btn.style.opacity = '0.8';
            btn.style.pointerEvents = 'none';

            try {
                const response = await fetch('https://weather-intelligence-pro.onrender.com/auth/register', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({
                        full_name: fullName,
                        email: email,
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if(response.ok) {
                    window.location.href = 'login.html';
                } else {
                    errorBox.innerHTML = `<i class="fas fa-circle-exclamation"></i> Registration Failed: ${data.detail || "User already exists"}`;
                    errorBox.style.display = 'block';
                    btn.innerHTML = 'Create Account <i class="fas fa-arrow-right"></i>';
                    btn.style.opacity = '1';
                    btn.style.pointerEvents = 'auto';
                }
            } catch(err) {
                console.error(err);
                errorBox.innerHTML = `<i class="fas fa-server"></i> Server connection failed!`;
                errorBox.style.display = 'block';
                
                btn.innerHTML = 'Create Account <i class="fas fa-arrow-right"></i>';
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
            }
        });
    </script>
</body>
</html>
